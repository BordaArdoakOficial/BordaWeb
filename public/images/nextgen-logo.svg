<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120">
    <style>
        .text { fill: white; font-family: sans-serif; }
        .title { font-weight: bold; font-size: 14px; }
        .subtitle { font-size: 10px; }
        .flag-blue { fill: none; stroke: white; stroke-width: 1; }
        .star { fill: white; }
    </style>
    
    <!-- Top Part: Plan de Recuperacion -->
    <g transform="translate(10, 10)">
        <!-- R Logo Mockup -->
        <circle cx="20" cy="20" r="18" fill="none" stroke="white" stroke-width="2"/>
        <text x="12" y="28" fill="white" font-family="serif" font-weight="bold" font-size="24">R</text>
        
        <!-- Text -->
        <text x="50" y="15" class="text title">Plan de Recuperación,</text>
        <text x="50" y="30" class="text title">Transformación</text>
        <text x="50" y="45" class="text title">y Resiliencia</text>
    </g>

    <!-- Divider -->
    <!-- <line x1="10" y1="65" x2="250" y2="65" stroke="white" stroke-opacity="0.3" /> -->

    <!-- Bottom Part: EU -->
    <g transform="translate(10, 70)">
        <!-- EU Flag Mockup -->
        <rect x="0" y="0" width="45" height="30" fill="none" stroke="white" stroke-width="1"/>
        <circle cx="22.5" cy="15" r="10" fill="none" stroke="white" stroke-width="0.5" stroke-dasharray="1,2"/>
        
        <!-- Text -->
        <text x="55" y="12" class="text subtitle">Financiado por</text>
        <text x="55" y="22" class="text title" style="font-size: 11px;">la Unión Europea</text>
        <text x="55" y="34" class="text subtitle">NextGenerationEU</text>
    </g>
</svg>